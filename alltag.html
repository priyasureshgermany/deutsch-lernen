<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alltag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--paper:#ffffff;--surface:#eef1f6;--ink:#1b2230;--muted:#5b6475;--line:#d9dee8;--b1:#2f5bd3;--a2:#b87d00;--a1:#1b8a6b;--ans:#8a3fa8;--hlbg:#e7edfc;--sheet:#fffdf7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#141821;--surface:#1d2230;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2c3344;--b1:#7e9dff;--a2:#e8b33c;--a1:#4cc79f;--ans:#d49bf0;--hlbg:#232c47;--sheet:#1a1f2b}}
:root[data-theme="dark"]{--paper:#141821;--surface:#1d2230;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2c3344;--b1:#7e9dff;--a2:#e8b33c;--a1:#4cc79f;--ans:#d49bf0;--hlbg:#232c47;--sheet:#1a1f2b}
*,*::before,*::after{box-sizing:border-box;touch-action:manipulation}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;margin:0}
header.hero{padding:24px 20px 12px;max-width:1100px;margin:0 auto}
.ladder{display:flex;gap:6px;margin-bottom:12px}
.ladder span{font-weight:700;font-size:13px;padding:3px 10px;border-radius:4px;color:#fff}
h1{font-size:clamp(28px,5.5vw,46px);font-weight:800;line-height:1.05;letter-spacing:-.02em}
.sub{color:var(--muted);max-width:70ch;margin:10px 0 0}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 20px 8px}
.bar-inner{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search]{flex:1 1 180px;min-width:0;font:inherit;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.tg{--c:var(--muted);font:inherit;font-size:14px;font-weight:700;padding:5px 11px;border-radius:999px;border:2px solid var(--c);background:var(--c);color:#fff;cursor:pointer}
.tg[aria-pressed="false"]{background:transparent;color:var(--c)}
.tg.speed{--c:var(--a1)}
main{max-width:1100px;margin:0 auto;padding:14px 20px 140px}
.split{display:grid;grid-template-columns:minmax(220px,320px) 1fr;gap:18px;align-items:start}
.list{display:flex;flex-direction:column;gap:5px}
.it{font:inherit;text-align:left;display:flex;flex-direction:column;gap:1px;width:100%;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);padding:8px 12px;cursor:pointer}
.it b{font-size:15px}
.it small{color:var(--muted);font-size:12px}
@media (hover:hover){.it:hover{background:var(--surface)}}
.it[aria-expanded="true"]{border-color:var(--b1);background:var(--hlbg)}
.detail{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
.ph0{color:var(--muted);border:1.5px dashed var(--line);border-radius:12px;padding:30px 20px;text-align:center}
.dcard{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px}
.dcard h2{font-size:24px;font-weight:800;color:var(--b1)}
.dcard .den{color:var(--muted);font-size:14px;margin-bottom:8px}
.box{background:var(--surface);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:15px}
.box > b:first-child{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px}
.box ul{margin:4px 0 0;padding-left:20px}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.tools .lab{font-size:12px;font-weight:700;color:var(--muted)}
.chip{font:inherit;font-size:13px;font-weight:700;padding:4px 11px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.play{border-color:var(--b1);color:var(--b1)}
.chip.play.on{background:var(--b1);color:#fff}
/* dialogue */
/* A chat: one speaker on the left, the other on the right; the name chip
   is blue for a man and pink for a woman. */
.lines{display:flex;flex-direction:column;gap:12px;margin:8px 0}
.ln{display:flex;flex-direction:column;align-items:flex-start;gap:3px;max-width:88%;--c:#2f5bd3}
.ln[data-g="f"]{--c:#c2185b}
.ln.A{align-self:flex-start}
.ln.B{align-self:flex-end;align-items:flex-end}
.who{display:inline-block;font-size:12px;line-height:18px;font-weight:700;color:#fff;background:var(--c);border-radius:999px;padding:1px 10px;white-space:nowrap}
.ln .body{background:var(--surface);border:1.5px solid var(--line);border-color:color-mix(in srgb,var(--c) 35%,transparent);border-radius:16px 16px 16px 4px;padding:8px 12px}
.ln.B .body{background:var(--hlbg);border-radius:16px 16px 4px 16px}
.ln.now .body{outline:2.5px solid var(--c);outline-offset:2px}
.res{display:flex;flex-direction:column;gap:1px;text-decoration:none;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0}
@media (hover:hover){.res:hover{border-color:var(--b1)}}
.res .rt{font-weight:700;color:var(--b1)}
.res .rp{font-size:14px}
.res .rm{font-size:12px;color:var(--muted)}
.box ol{margin:4px 0 0;padding-left:22px}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.bigplay{font:inherit;font-size:17px;font-weight:700;padding:10px 20px;border-radius:999px;border:none;background:var(--b1);color:#fff;cursor:pointer}
.bigplay.on{background:var(--ink);color:var(--paper)}
.hint0{font-size:13px;color:var(--muted);margin-bottom:6px}
.score{font-weight:700;color:var(--ink)}
.hq{padding:8px 0;border-top:1px dashed var(--line)}
.hq:first-of-type{border-top:none}
.hqo{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.hqo .chip.right{background:#1b8a6b;border-color:#1b8a6b;color:#fff}
.hqo .chip.wrong{background:#c62828;border-color:#c62828;color:#fff}
.hqw{font-size:14px;color:var(--muted);margin-top:4px}
.hqw b{color:var(--ink)}
.transcript{display:none}
.hoer.show-text .transcript{display:flex}
.fx{align-self:center;font-size:13px;color:var(--muted);background:var(--surface);border-radius:999px;padding:3px 12px}
.fx.now{outline:2px solid var(--b1)}
.vbox{display:none;background:var(--surface);border-radius:10px;padding:10px 12px;margin:6px 0 10px;font-size:14px}
.vbox.open{display:block}
.vbox .vr{display:flex;align-items:center;gap:8px;padding:4px 0;border-top:1px dashed var(--line)}
.vbox .vr:first-of-type{border-top:none}
.vbox .vr span{flex:1}
.vbox .vr small{color:var(--muted)}
.vbox .pick{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;margin-top:8px}
.vbox select{font:inherit;font-size:14px;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);min-width:0;width:100%}
.vbox .hint{color:var(--muted);font-size:13px;margin-top:6px}
.de{font-size:18px;line-height:1.55}
.hideme .de .s{filter:blur(7px);user-select:none;cursor:pointer}
.hideme .de::after{content:"Deine Rolle – sprich selbst, dann tippen";display:block;font-size:12px;color:var(--c);font-weight:700}
.acts{display:flex;gap:8px;align-items:center;margin-top:4px}
.enb{font:inherit;font-size:12px;font-weight:700;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:2px 10px;cursor:pointer}
.en{display:none;color:var(--muted);font-style:italic;margin-top:4px;font-size:15px}
.en-on > .en,.en-on .en{display:block}
.hideme .en{display:none!important}
/* letter */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:18px 20px;box-shadow:0 2px 10px rgba(20,30,60,.08)}
.sheet.hidden-letter .part{filter:blur(8px);user-select:none;pointer-events:none}
.part{padding:6px 0}
.part.m .de{font-size:13px;color:var(--muted);text-align:right}
.part.b .de{font-weight:700}
.part.g .de{white-space:pre-line}
.part .acts{margin-top:2px}
/* ▶ and EN sit at the right of their paragraph or bubble, one above the
   other, so the text reads straight through; the English opens below. */
.ln .body,.sheet .part{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;align-items:start}
.ln .body > .acts,.sheet .part > .acts{grid-column:2;grid-row:1;flex-direction:column;gap:5px;margin-top:2px}
.ln .body > .de,.sheet .part > .de,.ln .body > .fc-hide,.sheet .part > .fc-hide{grid-column:1;grid-row:1}
.ln .body > .en,.sheet .part > .en{grid-column:1 / -1}
.acts .enb{padding:2px 8px}
.say{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--b1);background:transparent;color:var(--b1);cursor:pointer;padding:0;flex:none}
.say::before{content:"";width:0;height:0;border-left:8px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent;margin-left:2px}
.say.on{background:var(--b1);color:#fff}
.say.on::before{border:none;width:8px;height:8px;background:currentColor;margin:0}
body.no-tts .say,body.no-tts .play,body.no-tts #sp{display:none}
.phr{display:flex;align-items:center;gap:8px;padding:4px 0;border-top:1px dashed var(--line)}
.phr:first-of-type{border-top:none}
.phr .t{flex:1}
.phr .t i{display:block;color:var(--muted);font-size:13px}
.ph{color:var(--ans);font-weight:700}
.w{cursor:pointer;border-radius:3px}
@media (hover:hover){.w:hover{background:var(--surface)}}
.w.sel{background:var(--b1);color:#fff}
/* read along: the part of the sentence already spoken turns light blue */
.w.read{color:#1a73e8;transition:color .15s}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .w.read{color:#6cb8ff}}
:root[data-theme="dark"] .w.read{color:#6cb8ff}
.inl{margin:4px 0 10px}
.empty{display:none;color:var(--muted);padding:20px 0}
#pop{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:440px;margin:0 auto;background:var(--paper);color:var(--ink);border:2px solid var(--b1);border-radius:12px;padding:12px 14px;z-index:20;box-shadow:0 8px 28px rgba(20,30,60,.28)}
#pop[hidden]{display:none}
#pop .p1{display:flex;justify-content:space-between;align-items:center;gap:8px}
#pw{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px;color:var(--b1);word-break:break-word}
#px{font:inherit;font-size:20px;line-height:1;background:none;border:none;color:var(--muted);cursor:pointer;padding:4px 8px}
.pen{font-size:18px;font-weight:700;margin-top:2px}
.pm{color:var(--muted);font-size:14px;margin-top:2px}
.pn{font-size:14px;margin-top:6px;font-style:italic}
.muted{color:var(--muted)}
.fb{margin-top:6px;font-size:15px}.fb a{color:var(--b1);font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid var(--b1);outline-offset:2px}
@media (max-width:760px){.bar,main,header.hero{padding-left:14px;padding-right:14px}.split{display:block}.detail{display:none}.de{font-size:17px}.sheet{padding:12px}.ln{max-width:92%}}
@media (min-width:761px){.inl{display:none}}
/* Cards (karten.js): the button sits in the label row at the top. */
.ladder{align-items:center}
.ladder .fc-open{margin-left:auto}
.fc-card .dcard{border:none;padding:0}
.fc-card .dcard h2{font-size:1.1em}
.fc-card .de{font-size:1.15em;line-height:1.35}
.fc-card .en,.fc-card .box{font-size:.85em}
.fc-card .lines{display:flex;flex-direction:column}
.fc-card .hoer:not(.show-text) .transcript{display:none}
.fc-card .hoer .hint0,.fc-card .hoer [data-solve]{display:none}
.fc-card .bigplay{font-size:max(15px,.8em)}
.fc-card .hoer .box{font-size:1em}
.fc-card .hqo{gap:.4em}
.fc-card .hqo .chip{font-size:.8em;padding:.4em .9em}
.fc-card .hqw{font-size:.85em}
.fc-card .ln{max-width:100%;gap:.25em}
.fc-card .ln .body{padding:.45em .7em}
.fc-card .who{font-size:max(12px,.6em);line-height:1.6}
.fc-card .sheet{padding:.7em .9em}
.fc-card .fc-kick{text-transform:none;letter-spacing:0}
.fc-card .who-row{display:flex;gap:.5em;margin-top:.6em}
.fc-card .who-row .ln{max-width:none}
.fc-card .phr{font-size:.95em}
.fc-card .phr .t i{font-size:.8em}
.fc-card .tools{font-size:max(13px,.7em)}
/* Übungsmodus on a card: the English stays, the German is to be said first. */
.fc.fc-pr .fc-card .en{display:block}
</style>
<link rel="stylesheet" href="karten.css">
</head>
<body>
<header class="hero">
 <div class="ladder"><span style="background:var(--b1)">B1</span><span style="background:var(--a2)" id="kind"></span></div>
 <h1 id="h1"></h1>
 <p class="sub" id="sub"></p>
</header>
<input type="hidden" id="q" value="">
<main>
 <div class="split">
  <div class="list" id="list"></div>
  <div class="detail" id="detail"></div>
 </div>
 <p class="empty" id="empty">Nichts gefunden.</p>
</main>
<div id="pop" hidden role="dialog" aria-live="polite"><div class="p1"><span id="pw"></span><button id="px" type="button" aria-label="Schließen">×</button></div><div id="pb"></div></div>
<script src="karten.js"></script>
<script src="me.js"></script>
<script src="gespraeche-data.js"></script>
<script src="briefe-data.js"></script>
<script src="hoeren-data.js"></script>
<script src="translate.js"></script>
<script>
/* One page, two tabs: ?t=dialog (Gespräche) or ?t=brief (Briefe). */
const MODE=({brief:"brief",hoeren:"hoeren"})[new URLSearchParams(location.search).get("t")]||"dialog";
const DATA=({brief:BR,hoeren:HS,dialog:GS})[MODE];
/* Meine Angaben (me.js): the learner's own details, and dates made up from
   today, in place of the [Platzhalter] – German and English alike. */
if(MODE!=="hoeren")DATA.forEach(d=>{const P=(o,a,b)=>{[o[a],o[b]]=Me.pair(o[a],o[b])};Me.about(JSON.stringify(d));
 ["parts","lines"].forEach(f=>(d[f]||[]).forEach(x=>P(x,1,2)));(d.tips||[]).forEach(x=>P(x,0,1));
 if(d.task)P(d,"task","taskEn");if(d.sit)P(d,"sit","sitEn");if(d.points)d.points=d.points.map(x=>Me.plain(Me.fill(x)))});
Me.about("");
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const W=s=>s.replace(/[A-Za-zÄÖÜäöüß]+(?:-[A-Za-zÄÖÜäöüß]+)*/g,m=>`<span class="w">${m}</span>`);
const PH=s=>Me.mark(s.replace(/\[([^\]]+)\]/g,'<span class="ph">[$1]</span>'));
const de=s=>s.split("\n").map(l=>PH(W(esc(l)))).join("\n");
const spoken=s=>s.replace(/[\[\]⟦⟧]/g,"");
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

document.getElementById("kind").textContent=({brief:"Schreiben",hoeren:"Hören",dialog:"Sprechen"})[MODE];
document.getElementById("h1").textContent=({brief:"Briefe für den Alltag",hoeren:"Hören wie im Alltag",dialog:"Gespräche im Alltag"})[MODE];
document.getElementById("sub").textContent=MODE==="hoeren"
 ?"Hören wie in der B1-Prüfung: Lies zuerst die Aufgaben, dann tippe auf ▶ – mit Gong, Bahnhofshalle, Café oder Telefon im Hintergrund. Der Text ist versteckt; mit „2× hören“ läuft alles zweimal wie in der Prüfung. Danach „Text zeigen“ zum Kontrollieren."
 :MODE==="brief"
 ?"Wähle links eine Situation. Du siehst die Aufgabe wie in der B1-Prüfung und einen Musterbrief. Mit „Selbst schreiben“ versteckst du den Brief und versuchst es zuerst allein. ▶ liest vor, „EN“ übersetzt, jedes Wort kannst du antippen."
 :"Wähle links eine Situation. ▶ liest einen Satz vor, „Ganzes Gespräch“ spielt den Dialog mit zwei Stimmen. Mit „Rolle üben“ wird eine Rolle versteckt – sprich sie selbst und tippe dann zum Kontrollieren.";
document.title=({brief:"Briefe",hoeren:"Hören",dialog:"Gespräche"})[MODE];

const listEl=document.getElementById("list"),detailEl=document.getElementById("detail"),q=document.getElementById("q"),empty=document.getElementById("empty");
const narrow=matchMedia("(max-width:760px)");
let open=null;
listEl.innerHTML=DATA.map((d,i)=>`<button type="button" class="it" data-k="${i}" aria-expanded="false"><b>${esc(d.de)}</b><small>${esc(d.en)}</small></button><div class="inl" data-for="${i}" hidden></div>`).join("");
detailEl.innerHTML=`<div class="ph0">Wähle links eine Situation.</div>`;

function sayBtn(text,voice){return `<button class="say" type="button" aria-label="Vorlesen" data-say="${esc(spoken(text))}"${voice?` data-v="${voice}"`:""}></button>`}
function block(g,en,voice){return `<div class="de"><span class="s" lang="de">${de(g)}</span></div><div class="acts">${sayBtn(g,voice)}<button class="enb" type="button">EN</button></div><div class="en">${esc(en)}</div>`}
function phrases(tips){return `<div class="box"><b>Wichtige Sätze</b>${tips.map(([g,e])=>`<div class="phr"><div class="t"><span class="s" lang="de">${de(g)}</span><i>${esc(e)}</i></div>${sayBtn(g)}</div>`).join("")}</div>`}

function dialogCard(d){
 const gs=genders(d),who=r=>esc(d.who[r]);
 const mine=d.g&&(d.g.A==="me"||d.g.B==="me");
 return `<div class="dcard"><h2>${esc(d.de)}</h2><div class="den">${esc(d.en)}</div>
  <div class="box en-wrap"><b>Situation</b><span class="s" lang="de">${de(d.sit)}</span> <button class="enb" type="button">EN</button><div class="en">${esc(d.sitEn)}</div></div>
  <div class="tools"><button class="chip play" type="button" data-all>▶ Ganzes Gespräch</button><span class="lab">Rolle üben:</span>
   <button class="chip" type="button" data-role="" aria-pressed="true">aus</button>
   <button class="chip" type="button" data-role="A" aria-pressed="false">${who("A")}</button>
   <button class="chip" type="button" data-role="B" aria-pressed="false">${who("B")}</button></div>
  <div class="tools">${mine?`<span class="lab">Meine Stimme:</span><button class="chip" type="button" data-me="m" aria-pressed="${myGender()==="m"}">Mann</button><button class="chip" type="button" data-me="f" aria-pressed="${myGender()==="f"}">Frau</button>`:""}<button class="chip" type="button" data-vbox aria-pressed="false">🔊 Stimmen</button></div>
  <div class="vbox"></div>
  <div class="lines">${d.lines.map(([r,g,e])=>`<div class="ln ${r}" data-g="${gs[r]}"><span class="who">${who(r)}</span><div class="body">${block(g,e,r)}</div></div>`).join("")}</div>
  ${phrases(d.tips)}</div>`}

/* Hören: an exam-style scene that plays inside the app – background sound,
   station chime or phone tones made with Web Audio, the voices of the
   device – with the transcript hidden until asked for, and questions. */
const KIND={Durchsage:"Durchsage",Telefon:"Telefon",Radio:"Radio",Gespräch:"Gespräch",Ansage:"Ansage"};
function hoerCard(d){
 const who=r=>esc(d.who[r][0]);
 const lines=d.parts.map((p,i)=>typeof p==="string"
  ?`<div class="fx" data-i="${i}">${p==="chime"?"🔔 Gong":p==="ring"?"📞 Telefon klingelt":"📟 Piepton"}</div>`
  :`<div class="ln ${p[0]}" data-g="${d.who[p[0]][1]}" data-i="${i}"><span class="who">${who(p[0])}</span><div class="body"><div class="de"><span class="s" lang="de">${de(p[1])}</span></div><div class="acts"><button class="enb" type="button">EN</button></div><div class="en">${esc(p[2])}</div></div></div>`).join("");
 const qs=d.q.map((q,i)=>{
  const opts=q[0]==="rf"?[["true","richtig"],["false","falsch"]]:q[2].map((o,j)=>[String(j),"abc"[j]+") "+o]);
  return `<div class="hq" data-q="${i}"><div class="hqt"><b>${i+1}.</b> <span class="s" lang="de">${de(q[1])}</span> <button class="enb" type="button">EN</button><div class="en">${esc(d.qen[i])}</div></div><div class="hqo">${opts.map(([v,l])=>`<button type="button" class="chip" data-a="${v}">${esc(l)}</button>`).join("")}</div><div class="hqw"></div></div>`}).join("");

  if(typeof p==="string"){const ms=p==="chime"?chime():p==="ring"?ring():beep();S.t=setTimeout(next,ms+300);return}
  const u=new SpeechSynthesisUtterance(p[1].replace(/[\[\]]/g,""));u.lang="de-DE";const v=voice[p[0]]||voice.A;if(v.voice)u.voice=v.voice;u.pitch=v.pitch;
  u.rate=rate*(d.kind==="Durchsage"||d.kind==="Ansage"?0.95:1);follow(u,card.querySelector(`[data-i="${k}"] .s`),u.text);u.onend=()=>{if(!S.stop)S.t=setTimeout(next,550)};u.onerror=e=>{if(e&&e.error==="interrupted")return;if(!S.stop)S.t=setTimeout(next,300)};
  synth.speak(u)};
 S.t=setTimeout(next,bg?1300:200)}
function answer(b){const hq=b.closest(".hq"),card=b.closest(".dcard"),d=DATA[+open],q=d.q[+hq.dataset.q];if(hq.dataset.done)return;
 const right=q[0]==="rf"?String(q[2]):String(q[3]);hq.dataset.done=b.dataset.a===right?"ok":"no";
 hq.querySelectorAll("[data-a]").forEach(x=>{if(x.dataset.a===right)x.classList.add("right");else if(x===b)x.classList.add("wrong")});
 hq.querySelector(".hqw").innerHTML=`<b>${b.dataset.a===right?"Richtig!":"Nicht ganz."}</b> ${esc(q[0]==="rf"?q[3]:q[4])}`;
 const done=card.querySelectorAll(".hq[data-done]"),ok=card.querySelectorAll('.hq[data-done="ok"]');card.querySelector(".score").textContent=`${ok.length} / ${done.length} richtig`}

/* ---- tap a word: the same in-popup translation as the other tabs ---- */
const pop=document.getElementById("pop"),pw=document.getElementById("pw"),pb=document.getElementById("pb");
let selEl=null,cur=null;
function FB(t){const e=encodeURIComponent(t);const a=(u,l)=>`<a href="${u}" target="_blank" rel="noopener">${l}</a>`;
 return `<div class="fb">Nachschlagen: ${a("https://translate.google.com/?sl=de&tl=en&op=translate&text="+e,"Google Übersetzer")} · ${a("https://www.deepl.com/translator#de/en/"+e,"DeepL")} · ${a("https://www.dict.cc/?s="+e,"dict.cc")}</div>`}
function closePop(){pop.hidden=true;if(selEl)selEl.classList.remove("sel");selEl=null;if(cur)cur.abort();cur=null}
document.getElementById("px").onclick=closePop;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePop()});
function cget(k){try{return JSON.parse(localStorage.getItem("al:"+k)||"null")}catch(e){return null}}
function cset(k,v){try{localStorage.setItem("al:"+k,JSON.stringify(v))}catch(e){}}
async function lookup(el){
 if(selEl)selEl.classList.remove("sel");selEl=el;el.classList.add("sel");
 const word=el.textContent,sent=el.closest(".s").textContent.replace(/"/g,"'").trim();
 pw.textContent=word;pb.innerHTML='<span class="muted">Übersetze …</span>';pop.hidden=false;
 const key=word+"|"+sent,hit=cget(key);if(hit){showWord(hit);return}
 if(!window.freeSample){pb.innerHTML=FB(word);return}
 if(cur)cur.abort();cur=new AbortController();const my=cur;
 try{const d=await window.freeSample.json(`You are a German-English dictionary for a B1 learner. Translate the German word "${word}" as it is used in this sentence: "${sent}".
Reply with ONLY a JSON object.`,{signal:my.signal});cset(key,d);if(selEl===el)showWord(d)}
 catch(err){if(err&&err.code==="cancelled")return;pb.innerHTML='<span class="muted">Übersetzung fehlgeschlagen (offline?).</span>'+FB(word)}}
function showWord(d){const s=x=>esc(x||"");
 pb.innerHTML=`<div class="pen">${s(d.en)}</div><div class="pm">${s(d.lemma)}${d.pos?" · "+s(d.pos):""}${d.plural?" · Pl. "+s(d.plural):""}</div>${d.note?`<div class="pn">${s(d.note)}</div>`:""}`}

document.querySelector("main").addEventListener("change",e=>{
 const s=e.target.closest("[data-pick]");if(!s)return;stopAll();
 /* One voice has one job: picking it here clears it from the other slots. */
 if(s.value)PICKS.forEach(([k])=>{if(k!==s.dataset.pick&&store("al:v"+k)===s.value)store("al:v"+k,"")});
 store("al:v"+s.dataset.pick,s.value);voiceBox(s.closest(".vbox"))});
/* Voices can arrive after the page: refresh an open panel when they do. */
if(synth)synth.addEventListener("voiceschanged",()=>document.querySelectorAll(".vbox.open").forEach(voiceBox));
document.querySelector("main").addEventListener("click",e=>{
 const all=e.target.closest("[data-all]");if(all){playAll(all);return}
 const sb=e.target.closest(".say");if(sb){speak(sb);return}
 const eb=e.target.closest(".enb");if(eb){eb.parentElement.classList.toggle("en-on");if(eb.parentElement.classList.contains("acts"))eb.parentElement.parentElement.classList.toggle("en-on");return}
 const sc=e.target.closest("[data-scene]");if(sc){playScene(sc);return}
 const tw=e.target.closest("[data-twice],[data-bg]");if(tw){tw.setAttribute("aria-pressed",String(tw.getAttribute("aria-pressed")!=="true"));return}
 const tx=e.target.closest("[data-text]");if(tx){const c=tx.closest(".dcard"),on=!c.classList.contains("show-text");c.classList.toggle("show-text",on);tx.setAttribute("aria-pressed",String(on));tx.textContent=on?"Text verstecken":"Text zeigen";return}
 const an=e.target.closest("[data-a]");if(an){answer(an);return}
 const so=e.target.closest("[data-solve]");if(so){so.closest(".dcard").querySelectorAll(".hq:not([data-done])").forEach(hq=>{const d=DATA[+open],q=d.q[+hq.dataset.q],r=q[0]==="rf"?String(q[2]):String(q[3]);hq.querySelector(`[data-a="${r}"]`).classList.add("right");hq.dataset.done="shown";hq.querySelector(".hqw").innerHTML=esc(q[0]==="rf"?q[3]:q[4])});return}
 const tv=e.target.closest("[data-test]");if(tv){testVoice(tv);return}
 const vb=e.target.closest("[data-vbox]");if(vb){const box=vb.closest(".dcard").querySelector(".vbox"),on=!box.classList.contains("open");
  box.classList.toggle("open",on);vb.setAttribute("aria-pressed",String(on));if(on)voiceBox(box);return}
 const mb=e.target.closest("[data-me]");if(mb){store("al:me",mb.dataset.me);stopAll();
  const card=mb.closest(".dcard"),wrap=card.parentElement;wrap.innerHTML=dialogCard(DATA[+open]);return}
 const rb=e.target.closest("[data-role]");if(rb){const card=rb.closest(".dcard");card.querySelectorAll("[data-role]").forEach(x=>x.setAttribute("aria-pressed",String(x===rb)));
  card.querySelectorAll(".ln").forEach(l=>l.classList.toggle("hideme",!!rb.dataset.role&&l.classList.contains(rb.dataset.role)));return}
 const hd=e.target.closest("[data-hide]");if(hd){const on=hd.getAttribute("aria-pressed")!=="true";hd.setAttribute("aria-pressed",String(on));hd.closest(".dcard").querySelector(".sheet").classList.toggle("hidden-letter",on);hd.textContent=on?"Musterbrief zeigen":"Selbst schreiben (Brief verstecken)";return}
 const hid=e.target.closest(".hideme");if(hid){hid.classList.remove("hideme");return}
 const w=e.target.closest(".w");if(w)lookup(w)});

/* ---- Karten (karten.js) ----
   Each card must make sense on its own, so a situation is never cut into
   single lines: Gespräche and Briefe get three cards each – the situation or
   task, the whole dialogue or letter, the important phrases. Hören: one
   question with its scene's player. "open" is set to the card's situation
   while the cards are up (voices and scenes read it) and given back to the
   list afterwards. */
let alEn=false,listOpen=null,alText=false;const alAns={};
const STEPS=MODE==="brief"?["Aufgabe","Brief","Wichtige Sätze"]:["Situation","Gespräch","Wichtige Sätze"];
const line=(g,e,voice)=>`<div class="fc-hide"><div class="de"><span class="s" lang="de">${de(g)}</span></div></div><div class="acts">${sayBtn(g,voice)}<button class="enb" type="button">EN</button></div><div class="en">${esc(e)}</div>`;
const enOn=()=>alEn?" en-on":"";
function stepCard(d,n){
 if(n===0)return MODE==="brief"
  ?`<div class="dcard"><h2>${esc(d.de)}</h2><div class="den">${esc(d.en)} · ${d.formal?"formell":"informell"}</div>
   <div class="box en-wrap${enOn()}"><b>Aufgabe</b><span class="s" lang="de">${de(d.task)}</span> ${sayBtn(d.task)}<button class="enb" type="button">EN</button><div class="en">${esc(d.taskEn)}</div>
   <ul>${d.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div></div>`
  :`<div class="dcard"><h2>${esc(d.de)}</h2><div class="den">${esc(d.en)}</div>
   <div class="box en-wrap${enOn()}"><b>Situation</b><span class="s" lang="de">${de(d.sit)}</span> ${sayBtn(d.sit)}<button class="enb" type="button">EN</button><div class="en">${esc(d.sitEn)}</div></div>
   <div class="who-row">${["A","B"].map(r=>`<span class="ln ${r}" data-g="${genders(d)[r]}"><span class="who">${esc(d.who[r])}</span></span>`).join("")}</div></div>`;
 if(n===2)return `<div class="dcard"><button type="button" data-all hidden></button><div class="box"><b>Wichtige Sätze</b><div class="lines">${d.tips.map(([g,e])=>`<div class="phr"><div class="t"><span class="fc-hide"><span class="s" lang="de">${de(g)}</span></span><i>${esc(e)}</i></div>${sayBtn(g)}</div>`).join("")}</div></div></div>`;
 if(MODE==="brief")return `<div class="dcard"><button type="button" data-all hidden></button><div class="sheet">${d.parts.map(([k,g,e])=>`<div class="part ${k}${enOn()}">${line(g,e)}</div>`).join("")}</div></div>`;
 const gs=genders(d),who=r=>esc(d.who[r]);
 return `<div class="dcard"><div class="tools"><button class="chip play" type="button" data-all>▶ Ganzes Gespräch</button><span class="lab">Rolle üben:</span>
   <button class="chip" type="button" data-role="" aria-pressed="true">aus</button><button class="chip" type="button" data-role="A" aria-pressed="false">${who("A")}</button><button class="chip" type="button" data-role="B" aria-pressed="false">${who("B")}</button></div>
  <div class="lines">${d.lines.map(([r,g,e])=>`<div class="ln ${r}" data-g="${gs[r]}"><span class="who">${who(r)}</span><div class="body${enOn()}">${line(g,e,r)}</div></div>`).join("")}</div></div>`}
const K=Karten({mount:document.querySelector("main"),
 deck:()=>DATA.flatMap((d,k)=>(MODE==="hoeren"?d.q:STEPS).map((x,n)=>({part:d.de,key:k,group:k,k,n}))),
 start:D=>{listOpen=open;return open===null?0:Math.max(0,D.findIndex(d=>d.k===+open))},
 render:x=>MODE==="hoeren"?hoerCard(DATA[x.k]):stepCard(DATA[x.k],x.n),
 meta:MODE==="hoeren"?null:x=>`${x.n?`<span>${esc(DATA[x.k].de)}</span>`:""}<span class="xpts">${STEPS[x.n]}</span>`,
 shown:(x,i,body)=>{const was=open;open=String(x.k);if(MODE==="hoeren")hoerShown(x,body,was)},
 info:MODE==="hoeren"?null:x=>{const d=DATA[x.k];return MODE==="brief"
  ?`<b>${esc(d.de)}</b> · <i>${esc(d.en)}</i><div>${de(d.task)}</div><ul>${d.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`
  :`<b>${esc(d.de)}</b> · <i>${esc(d.en)}</i><div>${de(d.sit)}</div>`},
 leave:()=>{closePop();stopAll();if(MODE!=="hoeren")stopScene()},
 close:x=>{stopScene();open=listOpen;const b=listEl.querySelector(`[data-k="${x.k}"]`);if(b)b.scrollIntoView({block:"center"})},
 tools:MODE==="hoeren"
  ?[{id:"play",icon:"play",label:"Abspielen",color:"var(--b1)",click:k=>{const b=k.body.querySelector("[data-scene]");if(b)playScene(b)}}]
  /* ▶ reads the whole card: the dialogue, the letter or all the phrases in turn. */
  :[{id:"play",icon:"play",label:"Vorlesen",color:"var(--b1)",click:k=>{const a=k.body.querySelector("[data-all]");if(a)playAll(a);else{const b=k.body.querySelector(".say");if(b)speak(b)}}},
    {id:"en",icon:"en",label:"Englisch",color:"var(--muted)",pressed:()=>alEn,click:k=>{alEn=!alEn;k.redraw()}},
    {builtin:"practice"}]});
document.querySelector(".ladder").appendChild(K.button);
/* Hören card: only this question shows; the scene goes on playing while you
   move between its questions, and answers and "Text zeigen" stay. */
function hoerShown(x,body,was){const card=body.querySelector(".dcard");
 if(was!==String(x.k))alText=false;
 card.querySelectorAll(".hq").forEach(h=>h.hidden=+h.dataset.q!==x.n);
 const tx=card.querySelector("[data-text]");if(alText){card.classList.add("show-text");tx.setAttribute("aria-pressed","true");tx.textContent="Text verstecken"}
 const a=(alAns[x.k]||{})[x.n];if(a!==undefined)answer(card.querySelector(`.hq[data-q="${x.n}"] [data-a="${a}"]`));
 if(was!==String(x.k))stopScene();
 else if(scene){const b=card.querySelector("[data-scene]");scene.btn=b;scene.card=card;b.classList.add("on");b.textContent="⏹ Stopp"}
 card.addEventListener("click",e=>{
  const an=e.target.closest("[data-a]");if(an&&!an.closest(".hq").dataset.done)(alAns[x.k]=alAns[x.k]||{})[x.n]=an.dataset.a;
  if(e.target.closest("[data-text]"))alText=!alText},true)}
</script>
</body>
