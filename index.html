<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deutsch lernen</title>
<meta name="description" content="telc A1 und B1 Prüfungstraining, 25 Gesprächsthemen Wörter erkennen und B1 Grammatik – mit Übersetzung, Lösungen und Vorlesen.">
<meta name="theme-color" content="#2f5bd3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Deutsch">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">
<style>
:root{--paper:#ffffff;--surface:#eef1f6;--ink:#1b2230;--muted:#5b6475;--line:#d9dee8;--b1:#2f5bd3;--a2:#b87d00;--a1:#1b8a6b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#141821;--surface:#1d2230;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2c3344;--b1:#7e9dff;--a2:#e8b33c;--a1:#4cc79f}}
:root[data-theme="dark"]{--paper:#141821;--surface:#1d2230;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2c3344;--b1:#7e9dff;--a2:#e8b33c;--a1:#4cc79f}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.4 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{flex:none;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;border-bottom:1px solid var(--line);background:var(--paper)}
.top{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:20px;letter-spacing:-.01em;margin-right:auto;white-space:nowrap}
.brand span{color:var(--b1)}
nav{display:flex;gap:4px;background:var(--surface);border-radius:999px;padding:3px;max-width:100%;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{--c:var(--b1);font:inherit;font-size:14px;font-weight:700;border:none;border-radius:999px;padding:6px 12px;background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap}
nav button[data-m="a1"]{--c:var(--a1)}nav button[data-m="themen"]{--c:var(--a2)}nav button[data-m="woerter"]{--c:#8a3fa8}nav button[data-m="grammatik"]{--c:#c25e00}nav button[data-m="gespraeche"]{--c:#00838f}nav button[data-m="briefe"]{--c:#ad1457}nav button[data-m="hoeren"]{--c:#6d4c41}
nav .s{display:none}
nav button[aria-selected="true"]{background:var(--c);color:#fff}
#upd{font:inherit;font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
#upd.ready{border-color:var(--b1);background:var(--b1);color:#fff}
main{flex:1;min-height:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--paper)}
iframe[hidden]{display:none}
button:focus-visible{outline:3px solid var(--b1);outline-offset:2px}
/* Full screen: only the section is left. The browser's own full screen where
   it is allowed (laptop, Android); on iPhone, which allows it only for video,
   hiding the bars is what gives the room. One round button brings them back. */
.fsb{display:flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--muted);cursor:pointer}
.fsb svg{width:17px;height:17px}
#tempo[aria-pressed="true"]{background:var(--a1);border-color:var(--a1);color:#fff}
/* Translator: German ⇄ English only. */
#trd{width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);margin:max(12px,8vh) auto auto;padding:14px 16px 12px;border:1px solid var(--line);border-radius:16px;
 background:var(--paper);color:var(--ink);box-shadow:0 12px 40px rgba(0,0,0,.35)}
#trd::backdrop{background:rgba(10,14,24,.45)}
.trhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.trhead b{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:19px}
.trdir{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:14px;font-weight:700;color:var(--b1)}
.chipb{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:4px 11px;background:transparent;color:var(--muted);cursor:pointer}
.trbox{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 10px;margin-bottom:8px}
.trbox textarea{display:block;width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-size:17px;resize:vertical;min-height:70px;outline:none}
.trout{min-height:52px;font-size:17px;white-space:pre-wrap}
.trout .muted,.trnote{color:var(--muted)}
.tract{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.tract .fsb{width:30px;height:30px}
.trnote{font-size:12px;margin:2px 0 0;text-align:center}
#fsx{display:none;position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:20;width:42px;height:42px;
 border:none;background:var(--b1);color:#fff;opacity:.9;box-shadow:0 2px 10px rgba(0,0,0,.3)}
body.full header,body.full nav{display:none}
body.full main{margin:env(safe-area-inset-top,0px) 0 0}
body.full #fsx{display:flex}
/* A section showing cards (one question per screen) asks for the whole frame:
   header and tab bar step aside until it goes back to its list. */
body.cards header,body.cards nav{display:none}
body.cards main{margin:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
/* Well above the bottom edge: on iPhone the bottom strip belongs to the
   system's home swipe, which swallowed drags that started on the button. */
/* Swiped off the right edge, as in the expense tracker: it slides away rather
   than vanishing, and a small tab on the edge brings it back. */
#fsx{touch-action:none;transition:transform .3s cubic-bezier(.2,.7,.3,1),opacity .22s ease}
html.fsx-tucked #fsx{transform:translateX(110px) scale(.9);opacity:0;pointer-events:none}
#fsxTab{display:none;position:fixed;right:0;bottom:calc(93px + env(safe-area-inset-bottom,0px));z-index:20;width:24px;height:48px;padding:0;place-items:center;
 border:1px solid var(--line);border-right:0;border-radius:11px 0 0 11px;background:var(--surface);color:var(--muted);opacity:.85;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer}
#fsxTab svg{width:15px;height:15px}
html.fsx-tucked body.full #fsxTab{display:grid}
@media (prefers-reduced-motion:reduce){#fsx{transition:none}}
nav .i{display:none}
@media (max-width:1100px){nav .l{display:none}nav .s{display:inline}}
/* Phones: the section bar moves to the bottom, as in an app – icon over a
   short label – and the top keeps only the title and version, so each
   section's own tools sit at the top of the screen. */
@media (max-width:760px){
 header{padding-top:calc(env(safe-area-inset-top,0px) + 6px);padding-bottom:6px}
 .brand{font-size:18px}
 main{margin-bottom:calc(58px + env(safe-area-inset-bottom,0px))}
 nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(8,1fr);gap:0;border-radius:0;
  padding:4px 2px calc(4px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line);overflow:visible}
 nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;padding:4px 0;border-radius:10px;
  font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:-.01em}
 nav button .i{display:flex;align-items:center;justify-content:center;width:40px;height:26px;border-radius:13px}
 nav button .i svg{width:20px;height:20px}
 nav button[aria-selected="true"]{background:transparent;color:var(--ink)}
 nav button[aria-selected="true"] .i{background:var(--c);color:#fff}
}
</style>
</head>
<body>
<header><div class="top">
 <div class="brand">Deutsch <span>lernen</span></div>
 <button id="upd" type="button" title="Nach neuer Version suchen">v–</button>
 <button id="tempo" class="fsb" type="button" aria-pressed="false"></button>
 <button id="tr" class="fsb" type="button" title="Übersetzen (Deutsch ⇄ Englisch)" aria-label="Übersetzen" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h8M8 3v2M10.5 5c-.8 3.2-3 5.8-6 7.2M6 8.5c1.2 1.6 2.7 2.8 4.5 3.5"/><path d="M13 21l4-10 4 10M14.5 17.5h5"/></svg></button>
 <nav role="tablist" aria-label="Bereiche">
  <button role="tab" data-m="a1" aria-selected="false"><span class="i" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3.5" width="14" height="18" rx="2"/><path d="M9 3.5h6v2.5H9z"/><path d="m9 13 2 2 4-4.5"/></svg></span><span class="l">A1 Prüfung</span><span class="s">A1</span></button>
  <button role="tab" data-m="b1" aria-selected="false"><span class="i" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3.5" width="14" height="18" rx="2"/><path d="M9 3.5h6v2.5H9z"/><path d="m9 13 2 2 4-4.5"/></svg></span><span class="l">B1 Prüfung</span><span class="s">B1</span></button>
  <button role="tab" data-m="themen" aria-selected="false"><span class="i" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/></svg></span><span class="l">Gesprächsthemen</span><span class="s">Themen</span></button>
  <button role="tab" data-m="woerter" aria-selected="false"><span class="i" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18 8.5 6 13 18"/><path d="M5.7 14h5.6"/><path d="M20 18v-5a2.5 2.5 0 0 0-5 0"/><path d="M20 15.5c-2.5 0-5 .4-5 1.8 0 .9.8 1.2 1.7 1.2 1.9 0 3.3-1.3 3.3-3"/></svg></span><span class="l">Wörter erkennen</span><span class="s">Wörter</span></button>
  <button role="tab" data-m="grammatik" aria-selected="false"><span class="i" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 21H20"/><path d="M9 8h7M9 12h5"/></svg></span><span class="l">B1 Grammatik</span><span class="s">Gramm.</span></button>
  <button role="tab" data-m="gespraeche" aria-selected="false"><span class="i" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9a5 5 0 0 1-7.3 4.4L3 14.5l1-3.3A5 5 0 1 1 14 9z"/><path d="M10 17.5a5 5 0 0 0 7.3 1.9l3.7 1.1-1-3.3a5 5 0 0 0-3-7.1"/></svg></span><span class="l">Gespräche</span><span class="s">Dialoge</span></button>
  <button role="tab" data-m="briefe" aria-selected="false"><span class="i" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/></svg></span><span class="l">Briefe</span><span class="s">Briefe</span></button>
  <button role="tab" data-m="hoeren" aria-selected="false"><span class="i" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4.5" height="6.5" rx="1.5"/><rect x="16.5" y="14" width="4.5" height="6.5" rx="1.5"/></svg></span><span class="l">Hören</span><span class="s">Hören</span></button>
 </nav>
 <button id="fs" class="fsb" type="button" title="Vollbild" aria-label="Vollbild"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div></header>
<main id="stage"></main>
<dialog id="trd" aria-labelledby="trh">
 <div class="trhead"><b id="trh">Übersetzen</b><button id="trx" class="fsb" type="button" aria-label="Schließen">✕</button></div>
 <div class="trdir"><span id="trdir">Deutsch ⇄ Englisch</span><button id="trswap" class="chipb" type="button" title="Richtung umdrehen">⇄ umdrehen</button></div>
 <div class="trbox"><textarea id="trin" rows="3" lang="de" placeholder="Wort oder Satz auf Deutsch oder Englisch …" aria-label="Text zum Übersetzen"></textarea>
  <div class="tract"><button id="trsayin" class="fsb" type="button" aria-label="Eingabe vorlesen" title="Vorlesen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button><button id="trclr" class="chipb" type="button">Leeren</button></div></div>
 <div class="trbox out"><div id="trout" class="trout" aria-live="polite"><span class="muted">Die Übersetzung erscheint hier.</span></div>
  <div class="tract"><button id="trsayout" class="fsb" type="button" aria-label="Übersetzung vorlesen" title="Vorlesen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button><button id="trcopy" class="chipb" type="button">Kopieren</button></div></div>
 <p class="trnote">Nur Deutsch und Englisch · braucht Internet</p>
</dialog>
<button id="fsxTab" type="button" title="Knopf zurückholen" aria-label="Vollbild-Knopf zurückholen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
<button id="fsx" class="fsb" type="button" title="Vollbild beenden – nach rechts wischen zum Verstecken" aria-label="Vollbild beenden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
<script src="translate.js"></script>
<script>
const APP_VERSION = "1.14.0";
const MODULES = { a1: "a1.html", b1: "b1.html", themen: "themen.html", woerter: "woerter.html", grammatik: "grammatik.html", gespraeche: "alltag.html?t=dialog", briefe: "alltag.html?t=brief", hoeren: "alltag.html?t=hoeren" };
const stage = document.getElementById("stage");
const tabs = [...document.querySelectorAll("nav button")];
const frames = {};

function store(k, v){ try{ if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }

/* Each section keeps its own frame once opened, so switching back returns to
   the same scroll position, search and practice state. */
function show(m){
  if(!MODULES[m]) m = "a1";
  if(!frames[m]){
    const f = document.createElement("iframe");
    f.src = MODULES[m];
    f.title = tabs.find(t => t.dataset.m === m).querySelector(".l").textContent;
    stage.appendChild(f);
    frames[m] = f;
    f.addEventListener("load", () => sendRate(f));
  }
  for(const k in frames) frames[k].hidden = k !== m;
  tabs.forEach(t => t.setAttribute("aria-selected", String(t.dataset.m === m)));
  store("dl:tab", m);
  if(location.hash !== "#" + m) history.replaceState(null, "", "#" + m);
}
tabs.forEach(t => t.onclick = () => show(t.dataset.m));
window.addEventListener("hashchange", () => show(location.hash.slice(1)));
show(location.hash.slice(1) || store("dl:tab") || "a1");

/* The app changes only when you ask it to: the service worker serves every
   page from its cache, and this button is the one thing that clears it. */
const upd = document.getElementById("upd");
let live = "";
upd.textContent = "v" + APP_VERSION;
async function checkLive(){
  try{
    const t = await (await fetch("index.html?check=" + Date.now(), { cache: "no-store" })).text();
    const v = (t.match(/const APP_VERSION = "([^"]+)"/) || [])[1];
    live = v && v !== APP_VERSION ? v : "";
  }catch(e){ live = ""; }
  upd.classList.toggle("ready", !!live);
  upd.textContent = live ? "Update auf v" + live : "v" + APP_VERSION;
  upd.title = live ? "Neue Version laden" : "Aktuell – nach neuer Version suchen";
  return live;
}
upd.onclick = async () => {
  if(!live){ upd.textContent = "Suche …"; if(!(await checkLive())){ upd.textContent = "v" + APP_VERSION + " ✓"; setTimeout(() => upd.textContent = "v" + APP_VERSION, 1500); } return; }
  upd.textContent = "Lade …";
  try{ for(const k of await caches.keys()) await caches.delete(k); }catch(e){}
  try{ for(const r of await navigator.serviceWorker.getRegistrations()) await r.update(); }catch(e){}
  location.reload();
};
if(navigator.onLine !== false) checkLive();

/* Tempo for every section's read-aloud: one button at the top instead of one
   in each section. A speedometer for normal, a snail for slow; the sections
   hear about it by message and keep it for the next thing they read. */
const tempo = document.getElementById("tempo");
const ICONS = {
  normal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 17a8.5 8.5 0 1 1 17 0"/><path d="M12 17l4.5-5"/><circle cx="12" cy="17" r="1.2" fill="currentColor"/></svg>',
  slow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="12" r="5.5"/><path d="M10 12a2 2 0 1 1 2-2"/><path d="M2.5 18.5h15a3 3 0 0 0 3-3V11"/><path d="M20.5 11l-1.5-3M20.5 11l1.3-3"/></svg>'
};
let rate = store("dl:rate") === "0.75" ? 0.75 : 1;
addEventListener("message", e => {
  if(e.origin === location.origin && e.data && "dlCards" in e.data) document.body.classList.toggle("cards", !!e.data.dlCards);
});
function sendRate(f){ try{ f.contentWindow.postMessage({ dlRate: rate }, location.origin === "null" ? "*" : location.origin); }catch(e){} }
function drawTempo(){
  const slow = rate !== 1;
  tempo.innerHTML = slow ? ICONS.slow : ICONS.normal;
  tempo.setAttribute("aria-pressed", String(slow));
  tempo.title = slow ? "Tempo: langsam – tippen für normal" : "Tempo: normal – tippen für langsam";
  tempo.setAttribute("aria-label", tempo.title);
}
tempo.onclick = () => { rate = rate === 1 ? 0.75 : 1; store("dl:rate", String(rate)); drawTempo(); for(const k in frames) sendRate(frames[k]); };
drawTempo();

/* Translator: whatever is typed goes German → English if it is German, and
   English → German otherwise, so no third language ever comes back. ⇄ turns
   the direction round for the text in the box. */
const trd = document.getElementById("trd"), trin = document.getElementById("trin"), trout = document.getElementById("trout"), trdir = document.getElementById("trdir");
let trFrom = "auto", trLast = { src: "de", out: "" }, trTimer = 0, trCtl = null;
const LANG = { de: "Deutsch", en: "Englisch" };
const trNote = document.querySelector(".trnote");
function trShowDir(src){ trdir.textContent = LANG[src] + " → " + LANG[src === "de" ? "en" : "de"] + (trFrom === "auto" ? " (erkannt)" : ""); }
async function translateNow(){
  clearTimeout(trTimer);
  const q = trin.value.trim();
  if(trCtl) trCtl.abort();
  if(!q){ trout.innerHTML = '<span class="muted">Die Übersetzung erscheint hier.</span>'; trFrom = "auto"; trdir.textContent = "Deutsch ⇄ Englisch"; trLast.out = ""; return; }
  const ctl = trCtl = new AbortController();
  trout.innerHTML = '<span class="muted">Übersetze …</span>';
  try{
    if(!window.dlTranslate) throw { code: "stale" };               // an old translate.js is still loaded
    const res = await window.dlTranslate(q, trFrom, ctl.signal);   // translate.js: Google, then MyMemory
    const src = res.src === "de" ? "de" : "en";
    if(ctl !== trCtl) return;
    trNote.textContent = "Nur Deutsch und Englisch · übersetzt mit " + res.via;
    trLast = { src, out: res.text };
    trin.lang = src; trout.lang = src === "de" ? "en" : "de";
    trShowDir(src);
    trout.textContent = res.text || "–";
  }catch(e){
    if(e && e.name === "AbortError") return;
    trout.innerHTML = '<span class="muted">' + (navigator.onLine === false ? "Keine Internetverbindung – Übersetzen braucht Internet." : e && e.code === "rate_limited" ? "Zu viele Anfragen – bitte kurz warten." : e && e.code === "stale" ? "Bitte oben auf die Versionsnummer tippen und die App neu laden." : "Kein Übersetzungsdienst erreichbar (Google und MyMemory). Bitte später noch einmal versuchen.") + "</span>";
  }
}
trin.addEventListener("input", () => { if(!trin.value.trim()) trFrom = "auto"; clearTimeout(trTimer); trTimer = setTimeout(translateNow, 600); });
trin.addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); translateNow(); } });
document.getElementById("trswap").onclick = () => {
  if(!trin.value.trim()) return;
  trFrom = trLast.src === "de" ? "en" : "de";   // force the other way for this text
  translateNow();
};
document.getElementById("trclr").onclick = () => { trin.value = ""; translateNow(); trin.focus(); };
document.getElementById("trcopy").onclick = async e => {
  if(!trLast.out) return;
  try{ await navigator.clipboard.writeText(trLast.out); e.target.textContent = "Kopiert ✓"; }catch(err){ e.target.textContent = "Nicht möglich"; }
  setTimeout(() => e.target.textContent = "Kopieren", 1400);
};
function speakText(text, lang){
  try{
    if(!text || !window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang === "de" ? "de-DE" : "en-GB"; u.rate = rate;
    const v = speechSynthesis.getVoices().find(x => x.lang && x.lang.toLowerCase().startsWith(lang) && !/eloquence|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|albert|fred|junior|ralph|kathy/i.test(x.name));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}
document.getElementById("trsayin").onclick = () => speakText(trin.value.trim(), trFrom === "auto" && !trLast.out ? "de" : trLast.src);
document.getElementById("trsayout").onclick = () => speakText(trLast.out, trLast.src === "de" ? "en" : "de");
document.getElementById("tr").onclick = () => { try{ trd.showModal(); }catch(e){ trd.setAttribute("open", ""); } setTimeout(() => trin.focus(), 50); };
document.getElementById("trx").onclick = () => trd.close();
trd.addEventListener("click", e => {   // a tap on the dimmed page outside the card closes it
  const r = trd.getBoundingClientRect();
  if(e.target === trd && (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)) trd.close();
});
trd.addEventListener("close", () => { if(window.speechSynthesis) speechSynthesis.cancel(); });

const root = document.documentElement;
function full(on){
  document.body.classList.toggle("full", on);
  try{
    if(on && root.requestFullscreen && !document.fullscreenElement) root.requestFullscreen().catch(() => {});
    if(!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
  }catch(e){}
}
document.getElementById("fs").onclick = () => full(true);
const fsx = document.getElementById("fsx");
/* A tap leaves full screen; a drag to the right past 40px tucks the button
   away instead. The button follows the finger, so what will happen is plain. */
let fsxFrom = null, fsxDx = 0, fsxDragged = false;
function tuck(on){ root.classList.toggle("fsx-tucked", on); store("dl:fsxTucked", on ? "1" : "0"); }
fsx.addEventListener("pointerdown", e => { fsxFrom = e.clientX; fsxDx = 0; fsxDragged = false; try{ fsx.setPointerCapture(e.pointerId); }catch(err){} });
fsx.addEventListener("pointermove", e => {
  if(fsxFrom === null) return;
  fsxDx = e.clientX - fsxFrom;
  if(Math.abs(fsxDx) > 6) fsxDragged = true;
  fsx.style.transition = "none";
  fsx.style.transform = "translateX(" + Math.max(0, fsxDx) + "px)";   // outwards only
});
function fsxSettle(){
  if(fsxFrom === null) return;
  fsx.style.transition = ""; fsx.style.transform = "";
  if(fsxDragged && fsxDx > 40) tuck(true);
  fsxFrom = null;
}
fsx.addEventListener("pointerup", fsxSettle);
fsx.addEventListener("pointercancel", fsxSettle);
fsx.onclick = () => { if(fsxDragged){ fsxDragged = false; return; } full(false); };
document.getElementById("fsxTab").onclick = () => tuck(false);
tuck(store("dl:fsxTucked") === "1");
/* Esc (or the system's own exit) leaves the browser's full screen: follow it. */
document.addEventListener("fullscreenchange", () => { if(!document.fullscreenElement) document.body.classList.remove("full"); });

if("serviceWorker" in navigator && location.protocol !== "file:"){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
